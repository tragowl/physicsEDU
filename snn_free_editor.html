<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNN 자유 에디터 Pro + Data Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; overflow: hidden; }
        canvas { cursor: crosshair; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .node-panel { position: absolute; width: 240px; z-index: 100; display: none; pointer-events: auto; }
        input[type=range] { accent-color: #3b82f6; cursor: pointer; }
        .footer-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 24px; background: rgba(255,255,255,0.7); font-size: 11px; color: #64748b; border-top: 1px solid rgba(0,0,0,0.05); }
        #rasterPanel { position: absolute; bottom: 80px; right: 24px; width: 400px; height: 220px; z-index: 50; display: none; overflow: hidden; }
        #rasterCanvas { background: #fff; border-radius: 8px; border: 1px solid #e2e8f0; }
        .rec-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .animate-pulse-fast { animation: pulse 0.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- Header -->
    <header class="h-14 flex justify-between items-center px-6 bg-white border-b border-slate-200 z-10">
        <div class="flex items-center gap-4">
            <h1 class="font-bold text-slate-800 text-lg">SNN Pro <span class="text-blue-500">Analyzer</span></h1>
            <div id="recordingIndicator" class="hidden items-center px-3 py-1 bg-red-50 text-red-600 rounded-full text-[10px] font-black border border-red-100">
                <span class="rec-dot animate-pulse-fast"></span> RECORDING DATA...
            </div>
        </div>
        
        <div class="flex gap-2 items-center">
            <!-- Recording Controls -->
            <div class="flex bg-slate-100 p-1 rounded-lg gap-1 mr-2">
                <button id="recordBtn" onclick="toggleRecording()" class="px-3 py-1 bg-white text-slate-700 border border-slate-200 rounded text-xs font-bold hover:bg-slate-50 transition shadow-sm">측정 시작</button>
                <button id="downloadCsvBtn" onclick="exportCSV()" class="px-3 py-1 bg-slate-200 text-slate-400 border border-slate-300 rounded text-xs font-bold transition opacity-50 cursor-not-allowed" disabled>CSV 분석 저장</button>
            </div>

            <button onclick="toggleRaster()" class="px-3 py-1 bg-amber-50 text-amber-600 border border-amber-200 rounded text-xs font-bold hover:bg-amber-100 transition">분석 도구</button>
            <div class="h-4 w-[1px] bg-slate-200 mx-1"></div>
            <button onclick="addNeuron()" class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded text-xs font-bold hover:bg-blue-100 transition">뉴런 추가</button>
            <button onclick="exportData()" class="px-3 py-1 bg-white border border-slate-300 rounded text-xs font-semibold hover:bg-slate-50 transition">구조 저장</button>
            <button id="simToggle" class="px-4 py-1 bg-slate-800 text-white rounded text-xs font-bold hover:bg-slate-900 transition">시뮬레이션 중지</button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden bg-[#f1f5f9]">
        <canvas id="simCanvas"></canvas>

        <!-- Raster Plot Panel -->
        <div id="rasterPanel" class="glass p-3 rounded-xl">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-black uppercase text-amber-600">Raster Plot (Real-time)</span>
                <button onclick="toggleRaster()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <canvas id="rasterCanvas" width="376" height="170"></canvas>
            <div class="flex justify-between mt-1 text-[8px] text-slate-400 font-mono">
                <span>-300 Frames</span>
                <span>Now</span>
            </div>
        </div>

        <!-- Property Editor -->
        <div id="propPanel" class="node-panel glass p-4 rounded-xl" onmousedown="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <span id="propTitle" class="text-[10px] font-black uppercase text-blue-600">Neuron Setting</span>
                <button onclick="closePanel()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <div id="neuronControls" class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">뉴런 유형</label>
                    <select id="prop_type" class="w-full text-xs p-1.5 border rounded bg-white outline-none">
                        <option value="excitatory">흥분성 (E)</option>
                        <option value="inhibitory">억제성 (I)</option>
                        <option value="io">입출력 (IO)</option>
                    </select>
                </div>
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">임계값</label><span id="val_threshold" class="text-[10px] font-mono text-slate-400">1.0</span></div>
                    <input type="range" id="prop_threshold" min="0.5" max="3.0" step="0.1" class="w-full">
                </div>
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">누설률 (Leak)</label><span id="val_leak" class="text-[10px] font-mono text-slate-400">0.05</span></div>
                    <input type="range" id="prop_leak" min="0.01" max="0.2" step="0.01" class="w-full">
                </div>
                <button onclick="deleteSelected()" class="w-full py-2 mt-2 bg-red-50 text-red-500 text-[10px] font-bold rounded border border-red-100 hover:bg-red-100 transition">요소 삭제</button>
            </div>
            <div id="synapseControls" class="space-y-4 hidden">
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">연결 강도 (Weight)</label><span id="val_weight" class="text-[10px] font-mono text-slate-400">0.8</span></div>
                    <input type="range" id="prop_weight" min="0.1" max="2.0" step="0.1" class="w-full">
                </div>
                <button onclick="deleteSelected()" class="w-full py-2 mt-2 bg-red-50 text-red-500 text-[10px] font-bold rounded border border-red-100 hover:bg-red-100 transition">연결 삭제</button>
            </div>
        </div>

        <!-- Legend -->
        <div class="absolute bottom-16 left-6 flex flex-col gap-2 pointer-events-none">
            <div class="glass px-4 py-2 rounded-lg text-[10px] font-bold text-slate-500 flex items-center gap-4">
                <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div> 흥분</div>
                <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-red-500"></div> 억제</div>
                <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div> 입출력</div>
            </div>
        </div>

        <div class="footer-info flex justify-between items-center">
            <div><span class="font-bold">© 2026. SNN Lab</span> | Data Analysis Edition</div>
            <div class="italic text-slate-400 hidden md:block">CSV 추출을 통해 스파이크 시계열과 네트워크 연결 강도를 분석할 수 있습니다.</div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const propPanel = document.getElementById('propPanel');
        const rasterCanvas = document.getElementById('rasterCanvas');
        const rasterCtx = rasterCanvas.getContext('2d');
        
        let width, height;
        let isSimulating = true;
        let camera = { x: 0, y: 0, zoom: 1 };
        let neurons = [];
        let spikes = [];
        let spikeHistory = []; 
        
        let isRecording = false;
        let recordedSpikes = []; 
        let recordingStartTime = 0;
        
        let currentTime = 0;
        let isRasterVisible = false;
        let typeCounters = { E: 1, I: 1, IO: 1 };

        class Neuron {
            constructor(x, y, type = 'excitatory', id = null) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.id = id || this.generateCleanId(type);
                this.v = 0;
                this.threshold = 1.0;
                this.leak = 0.05;
                this.refractory = 0;
                this.spikeAnim = 0;
                this.connections = [];
            }

            generateCleanId(type) {
                let prefix = type === 'inhibitory' ? 'I' : (type === 'io' ? 'IO' : 'E');
                const id = `${prefix}${typeCounters[prefix]}`;
                typeCounters[prefix]++;
                return id;
            }

            update() {
                if (this.refractory > 0) {
                    this.refractory--;
                    this.v *= 0.8;
                } else {
                    this.v *= (1 - this.leak);
                    if (this.v >= this.threshold) this.fire();
                }
                if (this.spikeAnim > 0) this.spikeAnim *= 0.85;
            }

            fire() {
                this.v = 1.2;
                this.spikeAnim = 1.0;
                this.refractory = 25;

                const spikeEvent = { neuronId: this.id, time: currentTime, type: this.type };
                
                spikeHistory.push(spikeEvent);
                if (spikeHistory.length > 2000) spikeHistory.shift();

                if (isRecording) {
                    recordedSpikes.push(spikeEvent);
                }

                this.connections.forEach(conn => {
                    const target = neurons.find(n => n.id === conn.targetId);
                    if (target) {
                        const dist = Math.sqrt(Math.pow(this.x - target.x, 2) + Math.pow(this.y - target.y, 2));
                        spikes.push(new Spike(this, target, conn.weight, dist));
                    }
                });
            }
        }

        class Spike {
            constructor(source, target, weight, dist) {
                this.source = source;
                this.target = target;
                this.weight = weight;
                this.type = source.type;
                this.dist = dist;
                this.progress = 0;
                this.speed = 4;
            }
            update() {
                this.progress += this.speed;
                if (this.progress >= this.dist) {
                    const effect = this.type === 'inhibitory' ? -this.weight * 1.5 : this.weight;
                    this.target.v += effect;
                    return false;
                }
                return true;
            }
        }

        // --- CSV Analysis Export (수정된 부분) ---
        function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const csvBtn = document.getElementById('downloadCsvBtn');
            const indicator = document.getElementById('recordingIndicator');

            if (!isRecording) {
                isRecording = true;
                recordedSpikes = [];
                recordingStartTime = currentTime;
                btn.innerText = "측정 종료";
                btn.classList.replace('bg-white', 'bg-red-500');
                btn.classList.replace('text-slate-700', 'text-white');
                
                // 비활성화 상태 유지 (기록중일땐 저장 불가)
                csvBtn.disabled = true;
                csvBtn.classList.add('opacity-50', 'cursor-not-allowed');
                indicator.classList.remove('hidden');
                indicator.classList.add('flex');
            } else {
                isRecording = false;
                btn.innerText = "측정 시작";
                btn.classList.replace('bg-red-500', 'bg-white');
                btn.classList.replace('text-white', 'text-slate-700');
                
                // 측정 종료 후 저장 버튼 활성화
                csvBtn.disabled = false;
                csvBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-200', 'text-slate-400');
                csvBtn.classList.add('bg-blue-500', 'text-white', 'hover:bg-blue-600', 'cursor-pointer');
                indicator.classList.replace('flex', 'hidden');
            }
        }

        function exportCSV() {
            if (recordedSpikes.length === 0) {
                const proceed = confirm("기록된 스파이크가 없습니다. 설정값만 포함한 CSV를 생성할까요?");
                if (!proceed) return;
            }

            let csvRows = [];
            
            // 1. Spikes Section
            csvRows.push("=== SPIKE TIME SERIES ===");
            csvRows.push("Time_Tick,Neuron_ID,Type,Relative_Time_ms");
            recordedSpikes.forEach(s => {
                const relativeTime = (s.time - recordingStartTime);
                csvRows.push(`${s.time},${s.neuronId},${s.type},${relativeTime}`);
            });

            // 2. Network Metadata Section
            csvRows.push("\n=== NETWORK STRUCTURE ===");
            csvRows.push("Neuron_ID,Type,Threshold,Leak");
            neurons.forEach(n => {
                csvRows.push(`${n.id},${n.type},${n.threshold},${n.leak}`);
            });

            // 3. Connectivity Section
            csvRows.push("\n=== SYNAPSE WEIGHTS ===");
            csvRows.push("Source_ID,Target_ID,Weight");
            neurons.forEach(n => {
                n.connections.forEach(c => {
                    csvRows.push(`${n.id},${c.targetId},${c.weight}`);
                });
            });

            const csvString = csvRows.join("\n");
            // BOM 추가 (Excel 한글 깨짐 방지)
            const BOM = "\uFEFF";
            const blob = new Blob([BOM + csvString], { type: 'text/csv;charset=utf-8;' });
            
            // 파일 다운로드 실행
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `snn_analysis_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // 메모리 해제
            setTimeout(() => URL.revokeObjectURL(url), 100);
        }

        // --- UI & Rendering Logic ---
        function worldToScreen(x, y) {
            return { x: (x - camera.x) * camera.zoom + width / 2, y: (y - camera.y) * camera.zoom + height / 2 };
        }
        function screenToWorld(x, y) {
            return { x: (x - width / 2) / camera.zoom + camera.x, y: (y - height / 2) / camera.zoom + camera.y };
        }
        function distToSegment(p, v, w) {
            const l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
            if (l2 === 0) return Math.sqrt(Math.pow(p.x - v.x, 2) + Math.pow(p.y - v.y, 2));
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt(Math.pow(p.x - (v.x + t * (w.x - v.x)), 2) + Math.pow(p.y - (v.y + t * (w.y - v.y)), 2));
        }

        let selectedElement = null;
        let hoveredNode = null;
        let draggingNode = null;
        let panning = false;
        let connectingFrom = null;
        let lastMouse = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', e => {
            const worldPos = screenToWorld(e.clientX, e.clientY - 56);
            const clickedNode = neurons.find(n => Math.sqrt(Math.pow(n.x - worldPos.x, 2) + Math.pow(n.y - worldPos.y, 2)) < 30);

            if (e.button === 0) {
                if (clickedNode) {
                    const dist = Math.sqrt(Math.pow(clickedNode.x - worldPos.x, 2) + Math.pow(clickedNode.y - worldPos.y, 2));
                    if (e.altKey) {
                        selectedElement = { type: 'node', data: clickedNode };
                        showPanel(e.clientX, e.clientY);
                    } else if (dist > 18) {
                        connectingFrom = clickedNode;
                        closePanel();
                    } else {
                        clickedNode.fire();
                        draggingNode = clickedNode;
                        closePanel();
                    }
                } else {
                    let foundSynapse = null;
                    neurons.forEach(n => {
                        n.connections.forEach(conn => {
                            const target = neurons.find(tn => tn.id === conn.targetId);
                            if (target) {
                                const d = distToSegment(worldPos, n, target);
                                if (d < 10) foundSynapse = { type: 'synapse', source: n, connection: conn };
                            }
                        });
                    });
                    if (e.altKey && foundSynapse) {
                        selectedElement = foundSynapse;
                        showPanel(e.clientX, e.clientY);
                    } else if (!e.altKey) {
                        selectedElement = null;
                        closePanel();
                    }
                }
            } else if (e.button === 2) panning = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', e => {
            const worldPos = screenToWorld(e.clientX, e.clientY - 56);
            hoveredNode = neurons.find(n => Math.sqrt(Math.pow(n.x - worldPos.x, 2) + Math.pow(n.y - worldPos.y, 2)) < 30);
            if (panning) {
                camera.x -= (e.clientX - lastMouse.x) / camera.zoom;
                camera.y -= (e.clientY - lastMouse.y) / camera.zoom;
            } else if (draggingNode) {
                draggingNode.x = worldPos.x;
                draggingNode.y = worldPos.y;
            }
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            if (connectingFrom && hoveredNode && connectingFrom !== hoveredNode) {
                if (!connectingFrom.connections.find(c => c.targetId === hoveredNode.id)) {
                    connectingFrom.connections.push({ targetId: hoveredNode.id, weight: 0.8 });
                }
            }
            draggingNode = null; panning = false; connectingFrom = null;
        });

        window.addEventListener('wheel', e => {
            camera.zoom = Math.max(0.2, Math.min(3, camera.zoom - e.deltaY * 0.001));
        }, { passive: true });

        window.addEventListener('contextmenu', e => e.preventDefault());

        function toggleRaster() {
            isRasterVisible = !isRasterVisible;
            document.getElementById('rasterPanel').style.display = isRasterVisible ? 'block' : 'none';
        }

        function updateRaster() {
            if (!isRasterVisible) return;
            rasterCtx.clearRect(0, 0, rasterCanvas.width, rasterCanvas.height);
            const rowHeight = (rasterCanvas.height - 20) / Math.max(1, neurons.length);
            const timeWindow = 300;
            
            neurons.forEach((n, i) => {
                const y = 10 + i * rowHeight + rowHeight/2;
                rasterCtx.strokeStyle = 'rgba(0,0,0,0.03)';
                rasterCtx.strokeRect(0, y, rasterCanvas.width, 1);
                rasterCtx.fillStyle = '#94a3b8';
                rasterCtx.font = '8px monospace';
                rasterCtx.fillText(n.id, 2, y - 2);
            });

            spikeHistory.forEach(s => {
                const timeDiff = currentTime - s.time;
                if (timeDiff > timeWindow) return;
                const x = rasterCanvas.width - (timeDiff / timeWindow) * rasterCanvas.width;
                const idx = neurons.findIndex(n => n.id === s.neuronId);
                if (idx !== -1) {
                    rasterCtx.fillStyle = s.type === 'inhibitory' ? '#ef4444' : '#3b82f6';
                    rasterCtx.fillRect(x, 10 + idx * rowHeight + 2, 2, rowHeight - 4);
                }
            });
        }

        function showPanel(x, y) {
            if (!selectedElement) return;
            propPanel.style.display = 'block';
            propPanel.style.left = Math.min(x + 20, window.innerWidth - 260) + 'px';
            propPanel.style.top = Math.min(y - 50, window.innerHeight - 340) + 'px';

            const nC = document.getElementById('neuronControls');
            const sC = document.getElementById('synapseControls');

            if (selectedElement.type === 'node') {
                const node = selectedElement.data;
                nC.classList.remove('hidden'); sC.classList.add('hidden');
                document.getElementById('propTitle').innerText = `Neuron [${node.id}]`;
                document.getElementById('prop_type').value = node.type;
                document.getElementById('prop_threshold').value = node.threshold;
                document.getElementById('prop_leak').value = node.leak;
                updateLabels(node);
                document.getElementById('prop_type').onchange = e => node.type = e.target.value;
                document.getElementById('prop_threshold').oninput = e => { node.threshold = parseFloat(e.target.value); updateLabels(node); };
                document.getElementById('prop_leak').oninput = e => { node.leak = parseFloat(e.target.value); updateLabels(node); };
            } else {
                const syn = selectedElement.connection;
                nC.classList.add('hidden'); sC.classList.remove('hidden');
                document.getElementById('propTitle').innerText = `Synapse Weight`;
                document.getElementById('prop_weight').value = syn.weight;
                document.getElementById('val_weight').innerText = syn.weight.toFixed(1);
                document.getElementById('prop_weight').oninput = e => {
                    syn.weight = parseFloat(e.target.value);
                    document.getElementById('val_weight').innerText = syn.weight.toFixed(1);
                };
            }
        }

        function updateLabels(node) {
            document.getElementById('val_threshold').innerText = node.threshold.toFixed(1);
            document.getElementById('val_leak').innerText = node.leak.toFixed(2);
        }

        function closePanel() { propPanel.style.display = 'none'; }

        function deleteSelected() {
            if (!selectedElement) return;
            if (selectedElement.type === 'node') {
                const id = selectedElement.data.id;
                neurons = neurons.filter(n => n.id !== id);
                neurons.forEach(n => n.connections = n.connections.filter(c => c.targetId !== id));
            } else {
                selectedElement.source.connections = selectedElement.source.connections.filter(c => c !== selectedElement.connection);
            }
            selectedElement = null; closePanel();
        }

        function addNeuron() {
            const pos = screenToWorld(width/2, height/2);
            neurons.push(new Neuron(pos.x, pos.y));
        }

        function exportData() {
            const data = { typeCounters, neurons: neurons.map(n => ({ id: n.id, x: n.x, y: n.y, type: n.type, threshold: n.threshold, leak: n.leak, connections: n.connections })) };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `snn_structure.txt`; a.click();
        }

        function init() {
            typeCounters = { E: 1, I: 1, IO: 1 };
            camera = { x: 0, y: 0, zoom: 1 };
            spikes = []; spikeHistory = []; currentTime = 0;
            const n1 = new Neuron(-200, -80, 'io');
            const n2 = new Neuron(-200, 80, 'io');
            const n3 = new Neuron(50, 0, 'excitatory');
            const n4 = new Neuron(250, 0, 'io');
            neurons = [n1, n2, n3, n4];
            n1.connections.push({ targetId: n3.id, weight: 1.1 });
            n2.connections.push({ targetId: n3.id, weight: 1.1 });
            n3.connections.push({ targetId: n4.id, weight: 1.2 });
            closePanel();
        }

        function updateSim() {
            if (!isSimulating) return;
            currentTime++;
            neurons.forEach(n => n.update());
            spikes = spikes.filter(s => s.update());
            updateRaster();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            neurons.forEach(n => {
                const s = worldToScreen(n.x, n.y);
                n.connections.forEach(conn => {
                    const target = neurons.find(node => node.id === conn.targetId);
                    if (!target) return;
                    const e = worldToScreen(target.x, target.y);
                    const isSelected = selectedElement?.connection === conn;
                    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y);
                    ctx.strokeStyle = isSelected ? '#3b82f6' : (n.type === 'inhibitory' ? 'rgba(239, 68, 68, 0.4)' : 'rgba(100, 116, 139, 0.2)');
                    ctx.lineWidth = (isSelected ? 5 : 2) * camera.zoom;
                    ctx.stroke();
                    const angle = Math.atan2(e.y - s.y, e.x - s.x);
                    ctx.beginPath(); ctx.arc(e.x - Math.cos(angle)*30*camera.zoom, e.y - Math.sin(angle)*30*camera.zoom, 4*camera.zoom, 0, Math.PI*2);
                    ctx.fillStyle = n.type === 'inhibitory' ? '#ef4444' : '#64748b'; ctx.fill();
                });
            });

            if (connectingFrom) {
                const s = worldToScreen(connectingFrom.x, connectingFrom.y);
                ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(lastMouse.x, lastMouse.y - 56);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }

            spikes.forEach(s => {
                const r = s.progress / s.dist;
                const pos = worldToScreen(s.source.x + (s.target.x - s.source.x) * r, s.source.y + (s.target.y - s.source.y) * r);
                ctx.beginPath(); ctx.arc(pos.x, pos.y, 5 * camera.zoom, 0, Math.PI * 2);
                ctx.fillStyle = s.type === 'inhibitory' ? '#ef4444' : '#3b82f6'; ctx.fill();
            });

            neurons.forEach(n => {
                const pos = worldToScreen(n.x, n.y);
                const isSelected = selectedElement?.data === n;
                const r = (26 + n.spikeAnim * 12) * camera.zoom;
                ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
                ctx.fillStyle = n.type === 'inhibitory' ? '#ef4444' : (n.type === 'io' ? '#94a3b8' : '#3b82f6'); ctx.fill();
                ctx.strokeStyle = isSelected ? '#000' : (n === hoveredNode ? '#1e293b' : '#fff');
                ctx.lineWidth = (isSelected ? 6 : 2.5) * camera.zoom; ctx.stroke();
                if (n.v > 0.02 && n.refractory === 0) {
                    ctx.beginPath(); ctx.arc(pos.x, pos.y, r + 5, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * Math.min(1, n.v / n.threshold)));
                    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 3 * camera.zoom; ctx.stroke();
                }
                ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(8, 11 * camera.zoom)}px Inter`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n.id, pos.x, pos.y);
            });
        }

        window.onload = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight - 56;
            init();
            (function loop() { updateSim(); draw(); requestAnimationFrame(loop); })();
        };

        document.getElementById('simToggle').onclick = (e) => {
            isSimulating = !isSimulating;
            e.target.innerText = isSimulating ? '시뮬레이션 중지' : '시뮬레이션 가동';
        };
    </script>
</body>
</html>
