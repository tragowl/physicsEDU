<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNN 에디터 by 현석쌤 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; overflow: hidden; }
        
        /* 캔버스 초기화 시 깜빡임 효과를 위한 트랜지션 추가 */
        canvas { cursor: crosshair; transition: opacity 0.2s ease; }
        
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        
        /* 공통 패널 스타일 */
        .movable-panel { position: absolute; z-index: 100; display: none; pointer-events: auto; }
        .panel-header { cursor: move; border-bottom: 1px solid rgba(0,0,0,0.05); margin-bottom: 8px; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 설정 패널 */
        #propPanel { width: 240px; }
        
        /* 광역 설정 패널 */
        #globalPanel { width: 270px; }
        
        /* 분석 패널 (크기 조절 가능) */
        #rasterPanel { 
            width: 480px; 
            height: 300px; 
            min-width: 300px; 
            min-height: 200px; 
            resize: both; 
            overflow: hidden; 
            padding: 12px;
            display: none;
            right: 40px;
            bottom: 80px;
        }
        #rasterContainer { width: 100%; height: calc(100% - 40px); position: relative; }
        #rasterCanvas { background: #fff; border-radius: 4px; border: 1px solid #e2e8f0; width: 100%; height: 100%; display: block; }
        
        input[type=range] { accent-color: #3b82f6; cursor: pointer; }
        
        /* 숫자 직접 입력 인풋 화살표 숨기기 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { opacity: 1; }

        .footer-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 24px; background: rgba(255,255,255,0.7); font-size: 11px; color: #64748b; border-top: 1px solid rgba(0,0,0,0.05); }
        
        .rec-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .animate-pulse-fast { animation: pulse 0.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- Header -->
    <header class="h-14 flex justify-between items-center px-4 bg-white border-b border-slate-200 z-10">
        <div class="flex items-center gap-4">
            <h1 class="font-bold text-slate-800 text-lg">SNN Pro <span class="text-blue-500">Analyzer</span></h1>
            
            <!-- 비우기 버튼 (강력한 작동을 위해 id 부여) -->
            <button id="btnEmptyCanvas" class="ml-2 px-3 py-1.5 bg-red-50 text-red-600 border border-red-200 rounded-md text-xs font-bold hover:bg-red-100 transition shadow-sm flex items-center gap-1">
                🗑 캔버스 비우기
            </button>

            <div id="recordingIndicator" class="hidden items-center px-3 py-1 bg-red-50 text-red-600 rounded-full text-[10px] font-black border border-red-100">
                <span class="rec-dot animate-pulse-fast"></span> RECORDING DATA...
            </div>
        </div>

        <div class="hidden xl:flex items-center text-xs text-slate-500 font-medium bg-slate-50 px-3 py-1.5 rounded-md border border-slate-200">
            💡 <span class="ml-1"><b>Shift+클릭</b>: 다중 선택 | <b>Alt+클릭</b>: 수정 | <b>드래그</b>: 연결</span>
        </div>
        
        <div class="flex gap-1.5 items-center">
            <div class="flex bg-slate-100 p-1 rounded-lg gap-1 mr-1">
                <button id="recordBtn" onclick="toggleRecording()" class="px-3 py-1 bg-white text-slate-700 border border-slate-200 rounded text-xs font-bold hover:bg-slate-50 transition shadow-sm">측정 시작</button>
                <div id="statusMsg" class="hidden px-3 py-1 text-[10px] font-bold text-emerald-600 animate-pulse">자동 저장됨</div>
            </div>

            <button onclick="toggleGlobalPanel()" class="px-2 py-1 bg-purple-50 text-purple-600 border border-purple-200 rounded text-xs font-bold hover:bg-purple-100 transition shadow-[0_0_10px_rgba(168,85,247,0.2)]">⚙️ 광역 설정</button>
            <div class="h-4 w-[1px] bg-slate-200 mx-0.5"></div>

            <button onclick="toggleRaster()" class="px-2 py-1 bg-amber-50 text-amber-600 border border-amber-200 rounded text-xs font-bold hover:bg-amber-100 transition">분석 (Raster)</button>
            <div class="h-4 w-[1px] bg-slate-200 mx-0.5"></div>
            
            <!-- 뉴런 추가 버튼 (분리됨) -->
            <button onclick="addNeuron()" class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded text-xs font-bold hover:bg-blue-100 transition shadow-[0_0_10px_rgba(59,130,246,0.2)]">+ 뉴런 추가</button>
            
            <div class="h-4 w-[1px] bg-slate-200 mx-0.5"></div>

            <button onclick="exportData()" class="px-2 py-1 bg-white border border-slate-300 rounded text-xs font-semibold hover:bg-slate-50 transition">저장</button>
            <button onclick="triggerFileInput()" class="px-2 py-1 bg-white border border-slate-300 rounded text-xs font-semibold hover:bg-slate-50 transition text-emerald-600">불러오기</button>
            <input type="file" id="importFile" class="hidden" accept=".txt,.json" onchange="handleFileImport(event)">

            <!-- 플레이 / 일시정지 아이콘 버튼 -->
            <button id="simToggle" class="ml-1 w-8 h-8 flex items-center justify-center bg-slate-800 text-white rounded-full hover:bg-slate-900 transition shadow-md" title="시뮬레이션 재생/일시정지">
                <svg id="pauseIcon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
                <svg id="playIcon" class="w-4 h-4 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden bg-[#f1f5f9]">
        <canvas id="simCanvas"></canvas>

        <!-- 분석 패널 -->
        <div id="rasterPanel" class="movable-panel glass rounded-xl">
            <div class="panel-header" id="rasterHeader">
                <span class="text-[10px] font-black uppercase text-amber-600">Raster Plot (Real-time)</span>
                <button onclick="toggleRaster()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            <div id="rasterContainer">
                <canvas id="rasterCanvas"></canvas>
            </div>
            <div class="flex justify-between mt-1 text-[8px] text-slate-400 font-mono">
                <span>-300 Frames</span>
                <span>Now</span>
            </div>
        </div>

        <!-- 광역 설정 패널 -->
        <div id="globalPanel" class="movable-panel glass p-4 rounded-xl" onmousedown="event.stopPropagation()">
            <div id="globalHeader" class="panel-header">
                <span class="text-[10px] font-black uppercase text-purple-600">Global Settings</span>
                <button onclick="document.getElementById('globalPanel').style.display='none'" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">신호 전달 속도</label><span id="val_globalSpeed" class="text-[10px] font-mono text-slate-400">4.0</span></div>
                    <input type="range" id="prop_globalSpeed" min="1" max="20" step="0.5" value="4" class="w-full">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] font-bold text-slate-500">역치도달시 발화확률 (%)</label>
                        <input type="number" id="input_globalProb" min="0" max="100" step="1" value="100" class="w-16 text-[10px] font-mono text-right border rounded px-1 outline-none text-slate-600 py-0.5 bg-slate-50">
                    </div>
                    <input type="range" id="prop_globalProb" min="0" max="100" step="1" value="100" class="w-full">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] font-bold text-slate-500">초당 자발적 발화 확률 (Hz)</label>
                        <input type="number" id="input_spontaneousProb" min="0" step="0.000001" value="0.000000" class="w-24 text-[10px] font-mono text-right border rounded px-1 outline-none text-slate-600 py-0.5 bg-slate-50">
                    </div>
                    <p class="text-[8px] text-slate-400 mt-1">※ 1초 기준 발화 기대 횟수</p>
                </div>
                <div class="pt-2 border-t border-slate-100">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-[10px] font-bold text-slate-500">불응기 시간 (Tick)</label>
                        <input type="number" id="input_globalRefractory" min="0" step="1" value="25" class="w-16 text-[10px] font-mono text-right border rounded px-1 outline-none text-slate-600 py-0.5 bg-slate-50">
                    </div>
                    <p class="text-[8px] text-slate-400 text-right">※ 1 Tick ≈ 16ms</p>
                </div>
            </div>
        </div>

        <!-- 설정창 (Property Panel) -->
        <div id="propPanel" class="movable-panel glass p-4 rounded-xl" onmousedown="event.stopPropagation()">
            <div id="propHeader" class="panel-header">
                <span id="propTitle" class="text-[10px] font-black uppercase text-blue-600">Neuron Setting</span>
                <button onclick="closePanel()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div id="neuronControls" class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">뉴런 유형</label>
                    <select id="prop_type" class="w-full text-xs p-1.5 border rounded bg-white outline-none">
                        <option value="excitatory">흥분성 (E)</option>
                        <option value="inhibitory">억제성 (I)</option>
                        <option value="io">입출력 (IO)</option>
                        <option value="input">입력 (In)</option>
                        <option value="output">출력 (Out)</option>
                    </select>
                </div>
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">임계값</label><span id="val_threshold" class="text-[10px] font-mono text-slate-400">1.0</span></div>
                    <input type="range" id="prop_threshold" min="0.5" max="3.0" step="0.1" class="w-full">
                </div>
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">누설률 (Leak)</label><span id="val_leak" class="text-[10px] font-mono text-slate-400">0.05</span></div>
                    <input type="range" id="prop_leak" min="0.01" max="0.2" step="0.01" class="w-full">
                </div>
                <button onclick="deleteSelected()" class="w-full py-2 mt-2 bg-red-50 text-red-500 text-[10px] font-bold rounded border border-red-100 hover:bg-red-100 transition">요소 삭제</button>
            </div>

            <div id="synapseControls" class="space-y-4 hidden">
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">연결 강도 (Weight)</label><span id="val_weight" class="text-[10px] font-mono text-slate-400">0.8</span></div>
                    <input type="range" id="prop_weight" min="0.1" max="2.0" step="0.1" class="w-full">
                </div>
                <button onclick="deleteSelected()" class="w-full py-2 mt-2 bg-red-50 text-red-500 text-[10px] font-bold rounded border border-red-100 hover:bg-red-100 transition">연결 삭제</button>
            </div>

            <div id="groupControls" class="space-y-4 hidden">
                <div class="p-2 bg-blue-50 rounded border border-blue-100 text-[10px] text-blue-700">
                    <span id="groupCount">0</span>개의 뉴런이 선택되었습니다.
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">그룹 이름 지정 (예: A, Layer1)</label>
                    <div class="flex gap-1">
                        <input type="text" id="group_name_input" placeholder="그룹명" class="flex-1 text-xs p-1.5 border rounded bg-white outline-none">
                        <button onclick="applyGroup()" class="px-3 py-1 bg-blue-500 text-white text-[10px] font-bold rounded hover:bg-blue-600 transition">적용</button>
                    </div>
                </div>
                <button onclick="deleteSelected()" class="w-full py-2 mt-2 bg-red-50 text-red-500 text-[10px] font-bold rounded border border-red-100 hover:bg-red-100 transition">선택 뉴런 모두 삭제</button>
            </div>
        </div>

        <div class="footer-info flex justify-between items-center pointer-events-none">
            <div><span class="font-bold">© Kim HyunSeok (tragowl@onedu.jje.go.kr)</span> | 교육적 이용 허용 / 상업적 이용 금지</div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const propPanel = document.getElementById('propPanel');
        const rasterPanel = document.getElementById('rasterPanel');
        const rasterCanvas = document.getElementById('rasterCanvas');
        const rasterCtx = rasterCanvas.getContext('2d');
        const globalPanel = document.getElementById('globalPanel'); 
        
        let width, height;
        let isSimulating = true;
        let camera = { x: 0, y: 0, zoom: 1 };
        
        // 메모리 관리를 위해 let으로 선언
        let neurons = [];
        let spikes = [];
        let spikeHistory = []; 
        
        let isRecording = false;
        let recordedSpikes = []; 
        let recordingStartTime = 0;
        let realRecordingStartTime = 0; 
        
        let currentTime = 0;
        let isRasterVisible = false;
        
        let typeCounters = { E: 1, I: 1, IN: 1, OUT: 1, IO: 1 };

        let selectedNodes = []; 
        let selectedElement = null; 

        // 광역 설정 상태 변수
        let globalSpeed = 4.0;
        let globalFireProb = 1.0;
        let globalSpontaneousProb = 0.0;
        let globalRefractoryTicks = 25;

        const DEFAULT_NETWORK = {
            "typeCounters": { "E": 20, "I": 8, "IN": 5, "OUT": 5 },
            "neurons": [
                {"id":"IN1","x":-500,"y":-150,"type":"input","threshold":1,"leak":0.05,"connections":[{"targetId":"E1","weight":1.2},{"targetId":"E2","weight":0.8}]},
                {"id":"IN2","x":-500,"y":-50,"type":"input","threshold":1,"leak":0.05,"connections":[{"targetId":"E2","weight":1.0},{"targetId":"E3","weight":0.8}]},
                {"id":"IN3","x":-500,"y":50,"type":"input","threshold":1,"leak":0.05,"connections":[{"targetId":"E3","weight":1.0},{"targetId":"E4","weight":0.8}]},
                {"id":"IN4","x":-500,"y":150,"type":"input","threshold":1,"leak":0.05,"connections":[{"targetId":"E4","weight":1.2},{"targetId":"E5","weight":0.8}]},
                {"id":"E1","x":-300,"y":-200,"type":"excitatory","threshold":1.2,"leak":0.05,"connections":[{"targetId":"E6","weight":1.0},{"targetId":"I1","weight":1.5}]},
                {"id":"E2","x":-300,"y":-100,"type":"excitatory","threshold":1.0,"leak":0.05,"connections":[{"targetId":"E6","weight":0.8},{"targetId":"E7","weight":1.0}]},
                {"id":"E3","x":-300,"y":0,"type":"excitatory","threshold":1.0,"leak":0.05,"connections":[{"targetId":"E7","weight":1.0},{"targetId":"E8","weight":0.8}]},
                {"id":"E4","x":-300,"y":100,"type":"excitatory","threshold":1.0,"leak":0.05,"connections":[{"targetId":"E8","weight":1.0},{"targetId":"E9","weight":0.8}]},
                {"id":"E5","x":-300,"y":200,"type":"excitatory","threshold":1.2,"leak":0.05,"connections":[{"targetId":"E9","weight":1.0},{"targetId":"I2","weight":1.5}]},
                {"id":"I1","x":-150,"y":-150,"type":"inhibitory","threshold":0.8,"leak":0.1,"connections":[{"targetId":"E2","weight":1.2},{"targetId":"E6","weight":1.5}]},
                {"id":"I2","x":-150,"y":150,"type":"inhibitory","threshold":0.8,"leak":0.1,"connections":[{"targetId":"E4","weight":1.2},{"targetId":"E9","weight":1.5}]},
                {"id":"E6","x":0,"y":-150,"type":"excitatory","threshold":1.5,"leak":0.05,"connections":[{"targetId":"E10","weight":1.2},{"targetId":"I3","weight":1.0}]},
                {"id":"E7","x":0,"y":-50,"type":"excitatory","threshold":1.2,"leak":0.05,"connections":[{"targetId":"E10","weight":0.8},{"targetId":"E11","weight":1.2}]},
                {"id":"E8","x":0,"y":50,"type":"excitatory","threshold":1.2,"leak":0.05,"connections":[{"targetId":"E11","weight":1.2},{"targetId":"E12","weight":0.8}]},
                {"id":"E9","x":0,"y":150,"type":"excitatory","threshold":1.5,"leak":0.05,"connections":[{"targetId":"E12","weight":1.2},{"targetId":"I4","weight":1.0}]},
                {"id":"I3","x":150,"y":-100,"type":"inhibitory","threshold":0.8,"leak":0.1,"connections":[{"targetId":"E10","weight":1.2},{"targetId":"OUT1","weight":0.5}]},
                {"id":"I4","x":150,"y":100,"type":"inhibitory","threshold":0.8,"leak":0.1,"connections":[{"targetId":"E12","weight":1.2},{"targetId":"OUT3","weight":0.5}]},
                {"id":"E10","x":300,"y":-100,"type":"excitatory","threshold":1.0,"leak":0.05,"connections":[{"targetId":"OUT1","weight":1.5},{"targetId":"OUT2","weight":0.8}]},
                {"id":"E11","x":300,"y":0,"type":"excitatory","threshold":1.0,"leak":0.05,"connections":[{"targetId":"OUT2","weight":1.5}]},
                {"id":"E12","x":300,"y":100,"type":"excitatory","threshold":1.0,"leak":0.05,"connections":[{"targetId":"OUT2","weight":0.8},{"targetId":"OUT3","weight":1.5}]},
                {"id":"OUT1","x":500,"y":-100,"type":"output","threshold":1.0,"leak":0.05,"connections":[]},
                {"id":"OUT2","x":500,"y":0,"type":"output","threshold":1.0,"leak":0.05,"connections":[]},
                {"id":"OUT3","x":500,"y":100,"type":"output","threshold":1.0,"leak":0.05,"connections":[]}
            ]
        };

        // --- Window Dragging Logic ---
        function makeMovable(panel, header) {
            let isDragging = false, offset = { x: 0, y: 0 };
            header.addEventListener('mousedown', (e) => { isDragging = true; offset.x = e.clientX - panel.offsetLeft; offset.y = e.clientY - panel.offsetTop; e.preventDefault(); });
            document.addEventListener('mousemove', (e) => { if (isDragging) { panel.style.left = (e.clientX - offset.x) + 'px'; panel.style.top = (e.clientY - offset.y) + 'px'; panel.style.right = 'auto'; panel.style.bottom = 'auto'; } });
            document.addEventListener('mouseup', () => isDragging = false);
        }

        makeMovable(propPanel, document.getElementById('propHeader'));
        makeMovable(rasterPanel, document.getElementById('rasterHeader'));
        makeMovable(globalPanel, document.getElementById('globalHeader')); 

        function toggleGlobalPanel() {
            globalPanel.style.display = globalPanel.style.display === 'block' ? 'none' : 'block';
            if (globalPanel.style.display === 'block') { globalPanel.style.left = '40%'; globalPanel.style.top = '100px'; }
        }

        // --- 전역 설정 패널 이벤트 연결 ---
        document.getElementById('prop_globalSpeed').oninput = (e) => { globalSpeed = parseFloat(e.target.value); document.getElementById('val_globalSpeed').innerText = globalSpeed.toFixed(1); };
        const rangeGlobalProb = document.getElementById('prop_globalProb');
        const inputGlobalProb = document.getElementById('input_globalProb');
        rangeGlobalProb.oninput = (e) => { inputGlobalProb.value = e.target.value; globalFireProb = parseFloat(e.target.value) / 100; };
        inputGlobalProb.oninput = (e) => { let val = Math.max(0, Math.min(100, parseFloat(e.target.value) || 0)); rangeGlobalProb.value = val; globalFireProb = val / 100; };
        document.getElementById('input_spontaneousProb').oninput = (e) => { globalSpontaneousProb = Math.max(0, parseFloat(e.target.value) || 0); };
        document.getElementById('input_globalRefractory').oninput = (e) => { globalRefractoryTicks = Math.max(0, parseInt(e.target.value) || 0); };

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                if (entry.target === rasterPanel) {
                    const container = document.getElementById('rasterContainer');
                    rasterCanvas.width = container.clientWidth;
                    rasterCanvas.height = container.clientHeight;
                }
            }
        });
        resizeObserver.observe(rasterPanel);

        class Neuron {
            constructor(x, y, type = 'excitatory', id = null) {
                this.x = x; this.y = y; this.type = type; this.id = id || this.generateCleanId(type);
                this.v = 0; this.threshold = 1.0; this.leak = 0.05; this.refractory = 0; this.spikeAnim = 0;
                this.connections = []; this.isNew = false;
            }
            generateCleanId(type) {
                let prefix = type === 'inhibitory' ? 'I' : type === 'input' ? 'IN' : type === 'output' ? 'OUT' : type === 'io' ? 'IO' : 'E';
                if (typeCounters[prefix] === undefined) typeCounters[prefix] = 1;
                return `${prefix}${typeCounters[prefix]++}`;
            }
            update() {
                if (this.refractory > 0) { this.refractory--; this.v *= 0.8; } 
                else {
                    this.v *= (1 - this.leak);
                    if (this.v >= this.threshold) {
                        if (Math.random() <= globalFireProb) this.fire(); else this.v = 0; 
                    } else if (globalSpontaneousProb > 0 && Math.random() <= (globalSpontaneousProb / 60)) {
                        this.fire();
                    }
                }
                if (this.spikeAnim > 0) this.spikeAnim *= 0.85;
            }
            fire() {
                this.v = 1.2; this.spikeAnim = 1.0; this.refractory = globalRefractoryTicks; 
                const spikeEvent = { neuronId: this.id, time: currentTime, type: this.type, realTime: performance.now() };
                spikeHistory.push(spikeEvent);
                if (spikeHistory.length > 5000) spikeHistory.shift();
                if (isRecording) recordedSpikes.push(spikeEvent);
                this.connections.forEach(conn => {
                    const target = neurons.find(n => n.id === conn.targetId);
                    if (target) spikes.push(new Spike(this, target, conn.weight, Math.sqrt(Math.pow(this.x - target.x, 2) + Math.pow(this.y - target.y, 2))));
                });
            }
        }

        class Spike {
            constructor(source, target, weight, dist) { this.source = source; this.target = target; this.weight = weight; this.type = source.type; this.dist = dist; this.progress = 0; this.speed = globalSpeed; }
            update() {
                this.progress += this.speed;
                if (this.progress >= this.dist) {
                    this.target.v += this.type === 'inhibitory' ? -this.weight * 1.5 : this.weight;
                    return false;
                }
                return true;
            }
        }

        function getFormattedDate() {
            const now = new Date();
            return `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function applyGroup() {
            const groupName = document.getElementById('group_name_input').value.trim();
            if (!groupName || selectedNodes.length === 0) return;
            let maxIndex = 0; const prefix = groupName + '-';
            neurons.forEach(n => {
                if (n.id.startsWith(prefix)) {
                    const num = parseInt(n.id.substring(prefix.length), 10);
                    if (!isNaN(num) && num > maxIndex) maxIndex = num;
                }
            });
            const idMap = {};
            selectedNodes.forEach((node, index) => {
                const newId = `${groupName}-${maxIndex + index + 1}`;
                idMap[node.id] = newId; node.id = newId; node.isNew = false;
            });
            neurons.forEach(n => n.connections.forEach(conn => { if (idMap[conn.targetId]) conn.targetId = idMap[conn.targetId]; }));
            document.getElementById('group_name_input').value = ""; showPanel(); 
        }

        function exportData() {
            const data = { typeCounters, neurons: neurons.map(n => ({ id: n.id, x: n.x, y: n.y, type: n.type, threshold: n.threshold, leak: n.leak, connections: n.connections })) };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'text/plain' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `snn_archi_${getFormattedDate()}.txt`; a.click();
        }

        function triggerFileInput() { document.getElementById('importFile').click(); }

        function handleFileImport(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { try { importData(JSON.parse(e.target.result)); } catch (err) { console.error("파일 파싱 에러:", err); } };
            reader.readAsText(file); event.target.value = '';
        }

        function importData(data) {
            neurons.splice(0, neurons.length); spikes.splice(0, spikes.length); spikeHistory.splice(0, spikeHistory.length); currentTime = 0;
            typeCounters = data.typeCounters || { E: 1, I: 1, IN: 1, OUT: 1, IO: 1 };
            data.neurons.forEach(nD => {
                const n = new Neuron(nD.x, nD.y, nD.type, nD.id);
                n.threshold = nD.threshold || 1.0; n.leak = nD.leak || 0.05; n.connections = nD.connections || [];
                neurons.push(n);
            });
            closePanel();
        }

        // ==========================================
        // [완벽 보완] 가장 강력한 비우기 이벤트 로직
        // ==========================================
        document.getElementById('btnEmptyCanvas').addEventListener('click', () => {
            if(confirm("진행중인 캔버스의 모든 뉴런과 연결을 완전히 삭제하시겠습니까? (복구 불가)")) {
                
                // 1. 배열 완전 삭제 (메모리 구조 불문하고 강제로 전부 날림)
                neurons.splice(0, neurons.length);
                spikes.splice(0, spikes.length);
                spikeHistory.splice(0, spikeHistory.length);
                selectedNodes.splice(0, selectedNodes.length);
                recordedSpikes.splice(0, recordedSpikes.length);
                
                // 2. 상태 변수 초기화
                typeCounters = { E: 1, I: 1, IN: 1, OUT: 1, IO: 1 };
                currentTime = 0;
                selectedElement = null;
                hoveredNode = null;
                draggingNode = null;
                connectingFrom = null;
                
                // 3. 캔버스 즉각 강제 삭제
                ctx.clearRect(0, 0, width, height);
                if (isRasterVisible) {
                    rasterCtx.clearRect(0, 0, rasterCanvas.width, rasterCanvas.height);
                }

                // 4. 열려있는 패널 닫기
                closePanel();

                // 5. 시각적 깜빡임 피드백 (확실히 초기화되었음을 알려줌)
                canvas.style.opacity = '0';
                setTimeout(() => canvas.style.opacity = '1', 150);
            }
        });

        function toggleRecording() {
            const btn = document.getElementById('recordBtn'), indicator = document.getElementById('recordingIndicator'), statusMsg = document.getElementById('statusMsg');
            if (!isRecording) {
                isRecording = true; recordedSpikes.length = 0; recordingStartTime = currentTime; realRecordingStartTime = performance.now();
                btn.innerText = "측정 종료"; btn.classList.replace('bg-white', 'bg-red-500'); btn.classList.replace('text-slate-700', 'text-white');
                indicator.classList.remove('hidden'); indicator.classList.add('flex'); statusMsg.classList.add('hidden');
            } else {
                isRecording = false; 
                btn.innerText = "측정 시작"; btn.classList.replace('bg-red-500', 'bg-white'); btn.classList.replace('text-white', 'text-slate-700');
                indicator.classList.replace('flex', 'hidden');
                exportCSV();
                statusMsg.classList.remove('hidden'); setTimeout(() => statusMsg.classList.add('hidden'), 3000);
            }
        }

        function exportCSV() {
            if (recordedSpikes.length === 0) return;
            const totalTicks = currentTime - recordingStartTime, totalRealTimeMs = performance.now() - realRecordingStartTime;
            const avgTickMs = totalTicks > 0 ? (totalRealTimeMs / totalTicks).toFixed(4) : 0;
            let csvRows = [
                "=== SIMULATION METADATA ===", `Average_Time_Per_Tick_ms,${avgTickMs}`, `Total_Ticks,${totalTicks}`, `Total_Real_Time_ms,${totalRealTimeMs.toFixed(2)}`,
                `Global_Signal_Speed,${globalSpeed}`, `Global_Fire_Probability,${globalFireProb}`, `Global_Spontaneous_Fire_Prob_Per_Sec,${globalSpontaneousProb}`, `Global_Refractory_Ticks,${globalRefractoryTicks}`, "",
                "=== SPIKE TIME SERIES ===", "Time_Tick,Neuron_ID,Type,Real_Relative_Time_ms"
            ];
            recordedSpikes.forEach(s => csvRows.push(`${s.time},${s.neuronId},${s.type},${s.realTime ? (s.realTime - realRecordingStartTime).toFixed(2) : ((s.time - recordingStartTime) * avgTickMs).toFixed(2)}`));
            csvRows.push("\n=== NETWORK STRUCTURE ===", "Neuron_ID,Type,Threshold,Leak");
            neurons.forEach(n => csvRows.push(`${n.id},${n.type},${n.threshold},${n.leak}`));
            csvRows.push("\n=== SYNAPSE WEIGHTS ===", "Source_ID,Target_ID,Weight,Distance");
            neurons.forEach(n => n.connections.forEach(c => {
                const targetNode = neurons.find(tn => tn.id === c.targetId);
                const dist = targetNode ? Math.sqrt(Math.pow(n.x - targetNode.x, 2) + Math.pow(n.y - targetNode.y, 2)).toFixed(2) : 0;
                csvRows.push(`${n.id},${c.targetId},${c.weight},${dist}`);
            }));
            const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `snn_data_${getFormattedDate()}.csv`; link.click();
        }

        function worldToScreen(x, y) { return { x: (x - camera.x) * camera.zoom + width / 2, y: (y - camera.y) * camera.zoom + height / 2 }; }
        function screenToWorld(x, y) { return { x: (x - width / 2) / camera.zoom + camera.x, y: (y - height / 2) / camera.zoom + camera.y }; }
        function distToSegment(p, v, w) {
            const l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2); if (l2 === 0) return Math.sqrt(Math.pow(p.x - v.x, 2) + Math.pow(p.y - v.y, 2));
            let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
            return Math.sqrt(Math.pow(p.x - (v.x + t * (w.x - v.x)), 2) + Math.pow(p.y - (v.y + t * (w.y - v.y)), 2));
        }

        let hoveredNode = null, draggingNode = null, panning = false, connectingFrom = null, lastMouse = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', e => {
            const worldPos = screenToWorld(e.clientX, e.clientY - 56);
            const clickedNode = neurons.find(n => Math.sqrt(Math.pow(n.x - worldPos.x, 2) + Math.pow(n.y - worldPos.y, 2)) < 30);
            if (e.button === 0) {
                if (clickedNode) {
                    clickedNode.isNew = false;
                    if (e.shiftKey) {
                        const idx = selectedNodes.indexOf(clickedNode);
                        if (idx > -1) selectedNodes.splice(idx, 1); else selectedNodes.push(clickedNode);
                        if (selectedNodes.length > 0) { selectedElement = { type: 'group' }; showPanel(e.clientX, e.clientY); } else closePanel();
                        return;
                    }
                    const dist = Math.sqrt(Math.pow(clickedNode.x - worldPos.x, 2) + Math.pow(clickedNode.y - worldPos.y, 2));
                    if (e.altKey) { selectedNodes = [clickedNode]; selectedElement = { type: 'node', data: clickedNode }; showPanel(e.clientX, e.clientY); }
                    else if (dist > 18) { connectingFrom = clickedNode; closePanel(); }
                    else { clickedNode.fire(); draggingNode = clickedNode; if (!selectedNodes.includes(clickedNode)) selectedNodes = [clickedNode]; closePanel(); }
                } else {
                    let foundSynapse = null;
                    neurons.forEach(n => n.connections.forEach(conn => {
                        const target = neurons.find(tn => tn.id === conn.targetId);
                        if (target && distToSegment(worldPos, n, target) < 10) foundSynapse = { type: 'synapse', source: n, connection: conn };
                    }));
                    if (e.altKey && foundSynapse) { selectedNodes = []; selectedElement = foundSynapse; showPanel(e.clientX, e.clientY); }
                    else if (!e.altKey) { selectedElement = null; selectedNodes.splice(0, selectedNodes.length); closePanel(); panning = true; }
                }
            } else panning = true;
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', e => {
            const worldPos = screenToWorld(e.clientX, e.clientY - 56);
            hoveredNode = neurons.find(n => Math.sqrt(Math.pow(n.x - worldPos.x, 2) + Math.pow(n.y - worldPos.y, 2)) < 30);
            if (panning) { camera.x -= (e.clientX - lastMouse.x) / camera.zoom; camera.y -= (e.clientY - lastMouse.y) / camera.zoom; }
            else if (draggingNode) {
                const dx = worldPos.x - screenToWorld(lastMouse.x, lastMouse.y - 56).x;
                const dy = worldPos.y - screenToWorld(lastMouse.x, lastMouse.y - 56).y;
                selectedNodes.forEach(n => { n.x += dx; n.y += dy; });
            }
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            if (connectingFrom && hoveredNode && connectingFrom !== hoveredNode) {
                if (!connectingFrom.connections.find(c => c.targetId === hoveredNode.id)) connectingFrom.connections.push({ targetId: hoveredNode.id, weight: 0.8 });
            }
            draggingNode = null; panning = false; connectingFrom = null;
        });

        window.addEventListener('wheel', e => camera.zoom = Math.max(0.2, Math.min(3, camera.zoom - e.deltaY * 0.001)), { passive: true });

        function toggleRaster() {
            isRasterVisible = !isRasterVisible;
            rasterPanel.style.display = isRasterVisible ? 'block' : 'none';
            if (isRasterVisible) {
                const container = document.getElementById('rasterContainer');
                rasterCanvas.width = container.clientWidth; rasterCanvas.height = container.clientHeight;
            }
        }

        function updateRaster() {
            if (!isRasterVisible) return;
            if (neurons.length === 0) { rasterCtx.clearRect(0, 0, rasterCanvas.width, rasterCanvas.height); return; }
            
            rasterCtx.clearRect(0, 0, rasterCanvas.width, rasterCanvas.height);
            const rowHeight = (rasterCanvas.height - 10) / neurons.length, timeWindow = 300;
            neurons.forEach((n, i) => {
                const y = 5 + i * rowHeight + rowHeight/2;
                rasterCtx.strokeStyle = 'rgba(0,0,0,0.03)'; rasterCtx.strokeRect(0, y, rasterCanvas.width, 1);
                rasterCtx.fillStyle = '#94a3b8'; rasterCtx.font = '8px monospace'; rasterCtx.fillText(n.id, 2, y - 2);
            });
            spikeHistory.forEach(s => {
                const timeDiff = currentTime - s.time; if (timeDiff > timeWindow) return;
                const x = rasterCanvas.width - (timeDiff / timeWindow) * rasterCanvas.width, idx = neurons.findIndex(n => n.id === s.neuronId);
                if (idx !== -1) {
                    rasterCtx.fillStyle = s.type === 'inhibitory' ? '#ef4444' : (s.type === 'input' ? '#10b981' : (s.type === 'output' ? '#8b5cf6' : (s.type === 'io' ? '#94a3b8' : '#3b82f6')));
                    rasterCtx.fillRect(x, 5 + idx * rowHeight + 1, 2, rowHeight - 2);
                }
            });
        }

        function showPanel(x, y) {
            if (!selectedElement) return;
            propPanel.style.display = 'block';
            if (x && y) { propPanel.style.left = Math.min(x + 20, window.innerWidth - 260) + 'px'; propPanel.style.top = Math.min(y - 50, window.innerHeight - 340) + 'px'; }
            const nC = document.getElementById('neuronControls'), sC = document.getElementById('synapseControls'), gC = document.getElementById('groupControls');
            nC.classList.add('hidden'); sC.classList.add('hidden'); gC.classList.add('hidden');
            if (selectedElement.type === 'node') {
                const node = selectedElement.data; nC.classList.remove('hidden');
                document.getElementById('propTitle').innerText = `Neuron [${node.id}]`;
                document.getElementById('prop_type').value = node.type;
                document.getElementById('prop_threshold').value = node.threshold;
                document.getElementById('prop_leak').value = node.leak;
                updateLabels(node);
                document.getElementById('prop_type').onchange = e => node.type = e.target.value;
                document.getElementById('prop_threshold').oninput = e => { node.threshold = parseFloat(e.target.value); updateLabels(node); };
                document.getElementById('prop_leak').oninput = e => { node.leak = parseFloat(e.target.value); updateLabels(node); };
            } else if (selectedElement.type === 'synapse') {
                const syn = selectedElement.connection; sC.classList.remove('hidden');
                document.getElementById('propTitle').innerText = `Synapse Weight`;
                document.getElementById('prop_weight').value = syn.weight;
                document.getElementById('val_weight').innerText = syn.weight.toFixed(1);
                document.getElementById('prop_weight').oninput = e => { syn.weight = parseFloat(e.target.value); document.getElementById('val_weight').innerText = syn.weight.toFixed(1); };
            } else if (selectedElement.type === 'group') {
                gC.classList.remove('hidden'); document.getElementById('propTitle').innerText = `Group Action`; document.getElementById('groupCount').innerText = selectedNodes.length;
            }
        }

        function updateLabels(node) { document.getElementById('val_threshold').innerText = node.threshold.toFixed(1); document.getElementById('val_leak').innerText = node.leak.toFixed(2); }
        function closePanel() { propPanel.style.display = 'none'; }

        function deleteSelected() {
            if (!selectedElement) return;
            if (selectedElement.type === 'node') {
                const id = selectedElement.data.id;
                neurons = neurons.filter(n => n.id !== id);
                neurons.forEach(n => n.connections = n.connections.filter(c => c.targetId !== id));
            } else if (selectedElement.type === 'synapse') {
                selectedElement.source.connections = selectedElement.source.connections.filter(c => c !== selectedElement.connection);
            } else if (selectedElement.type === 'group') {
                const idsToRemove = selectedNodes.map(n => n.id);
                neurons = neurons.filter(n => !idsToRemove.includes(n.id));
                neurons.forEach(n => n.connections = n.connections.filter(c => !idsToRemove.includes(c.targetId)));
                selectedNodes.splice(0, selectedNodes.length);
            }
            selectedElement = null; closePanel();
        }

        function addNeuron() {
            const pos = screenToWorld(width/2, height/2);
            const newNode = new Neuron(pos.x, pos.y);
            newNode.isNew = true; neurons.push(newNode);
        }

        function init() { importData(DEFAULT_NETWORK); camera = { x: 0, y: 0, zoom: 0.85 }; }

        function updateSim() { if (isSimulating) { currentTime++; neurons.forEach(n => n.update()); spikes = spikes.filter(s => s.update()); updateRaster(); } }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            neurons.forEach(n => {
                const s = worldToScreen(n.x, n.y);
                n.connections.forEach(conn => {
                    const target = neurons.find(node => node.id === conn.targetId); if (!target) return;
                    const e = worldToScreen(target.x, target.y);
                    const isSelected = selectedElement?.connection === conn;
                    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y);
                    ctx.strokeStyle = isSelected ? '#3b82f6' : (n.type === 'inhibitory' ? 'rgba(239, 68, 68, 0.4)' : 'rgba(100, 116, 139, 0.2)');
                    ctx.lineWidth = (isSelected ? 5 : 2) * camera.zoom; ctx.stroke();
                    const angle = Math.atan2(e.y - s.y, e.x - s.x);
                    ctx.beginPath(); ctx.arc(e.x - Math.cos(angle)*30*camera.zoom, e.y - Math.sin(angle)*30*camera.zoom, 4*camera.zoom, 0, Math.PI*2);
                    ctx.fillStyle = n.type === 'inhibitory' ? '#ef4444' : '#64748b'; ctx.fill();
                });
            });
            if (connectingFrom) {
                const s = worldToScreen(connectingFrom.x, connectingFrom.y);
                ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(lastMouse.x, lastMouse.y - 56);
                ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
            }
            spikes.forEach(s => {
                const r = s.progress / s.dist, pos = worldToScreen(s.source.x + (s.target.x - s.source.x) * r, s.source.y + (s.target.y - s.source.y) * r);
                ctx.beginPath(); ctx.arc(pos.x, pos.y, 5 * camera.zoom, 0, Math.PI * 2);
                ctx.fillStyle = s.type === 'inhibitory' ? '#ef4444' : (s.type === 'input' ? '#10b981' : (s.type === 'output' ? '#8b5cf6' : (s.type === 'io' ? '#94a3b8' : '#3b82f6'))); 
                ctx.fill();
            });
            neurons.forEach(n => {
                const pos = worldToScreen(n.x, n.y), isSelected = selectedNodes.includes(n) || selectedElement?.data === n, r = (26 + n.spikeAnim * 12) * camera.zoom;
                if (n.isNew) {
                    ctx.save(); ctx.beginPath(); ctx.arc(pos.x, pos.y, r + 12, 0, Math.PI * 2); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3 * camera.zoom;
                    ctx.setLineDash([8, 4]); ctx.lineDashOffset = -currentTime * 0.5; ctx.stroke(); ctx.restore();
                }
                if (isSelected) { ctx.beginPath(); ctx.arc(pos.x, pos.y, r + 8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(59, 130, 246, 0.2)'; ctx.fill(); }
                ctx.beginPath(); ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
                ctx.fillStyle = n.type === 'inhibitory' ? '#ef4444' : (n.type === 'input' ? '#10b981' : (n.type === 'output' ? '#8b5cf6' : (n.type === 'io' ? '#94a3b8' : '#3b82f6'))); 
                ctx.fill();
                ctx.strokeStyle = isSelected ? '#3b82f6' : (n === hoveredNode ? '#1e293b' : '#fff');
                ctx.lineWidth = (isSelected ? 6 : 2.5) * camera.zoom; ctx.stroke();
                if (n.v > 0.02 && n.refractory === 0) {
                    ctx.beginPath(); ctx.arc(pos.x, pos.y, r + 5, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * Math.min(1, n.v / n.threshold)));
                    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 3 * camera.zoom; ctx.stroke();
                }
                ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(8, 11 * camera.zoom)}px Inter`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n.id, pos.x, pos.y);
            });
        }

        window.onload = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight - 56; init(); (function loop() { updateSim(); draw(); requestAnimationFrame(loop); })(); };
        window.onresize = () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight - 56; };
        
        document.getElementById('simToggle').onclick = () => { 
            isSimulating = !isSimulating;
            document.getElementById('pauseIcon').classList.toggle('hidden', !isSimulating);
            document.getElementById('playIcon').classList.toggle('hidden', isSimulating);
        };
    </script>
</body>
</html>
