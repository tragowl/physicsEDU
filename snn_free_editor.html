<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNN 자유 에디터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; overflow: hidden; }
        canvas { cursor: crosshair; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .node-panel { position: absolute; width: 240px; z-index: 100; display: none; pointer-events: auto; }
        input[type=range] { accent-color: #3b82f6; cursor: pointer; }
        .instruction-badge { background: #fff; border: 1px solid #e2e8f0; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #64748b; }
        .key-hint { background: #e2e8f0; padding: 1px 4px; border-radius: 4px; font-family: monospace; color: #1e293b; }
        .footer-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 12px 24px; background: rgba(255,255,255,0.7); font-size: 11px; color: #64748b; border-top: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- Header -->
    <header class="h-14 flex justify-between items-center px-6 bg-white border-b border-slate-200 z-10">
        <div class="flex items-center gap-4">
            <h1 class="font-bold text-slate-800 text-lg">SNN 자유 에디터</h1>
            <div class="hidden md:flex gap-2">
                <span class="instruction-badge">클릭: 자극</span>
                <span class="instruction-badge"><span class="key-hint">Alt</span> + 클릭: 설정창</span>
                <span class="instruction-badge">가장자리 드래그: 연결</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="addNeuron()" class="px-3 py-1 bg-blue-50 text-blue-600 border border-blue-200 rounded text-xs font-bold hover:bg-blue-100 transition">뉴런 추가</button>
            <button id="resetBtn" class="px-3 py-1 bg-white border border-slate-300 rounded text-xs font-semibold hover:bg-slate-50 transition">초기화</button>
            <button id="simToggle" class="px-4 py-1 bg-slate-800 text-white rounded text-xs font-bold hover:bg-slate-900 transition">시뮬레이션 중지</button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden bg-[#f1f5f9]">
        <canvas id="simCanvas"></canvas>

        <!-- Node/Synapse Property Editor -->
        <div id="propPanel" class="node-panel glass p-4 rounded-xl" onmousedown="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <span id="propTitle" class="text-[10px] font-black uppercase text-blue-600">Neuron Setting</span>
                <button onclick="closePanel()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>
            
            <div id="neuronControls" class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">뉴런 유형</label>
                    <select id="prop_type" class="w-full text-xs p-1.5 border rounded bg-white outline-none">
                        <option value="excitatory">흥분성 (E)</option>
                        <option value="inhibitory">억제성 (I)</option>
                        <option value="io">입출력 (IO)</option>
                    </select>
                </div>
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">임계값</label><span id="val_threshold" class="text-[10px] font-mono text-slate-400">1.0</span></div>
                    <input type="range" id="prop_threshold" min="0.5" max="3.0" step="0.1" class="w-full">
                </div>
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">누설률 (Leak)</label><span id="val_leak" class="text-[10px] font-mono text-slate-400">0.05</span></div>
                    <input type="range" id="prop_leak" min="0.01" max="0.2" step="0.01" class="w-full">
                </div>
                <button onclick="deleteSelected()" class="w-full py-2 mt-2 bg-red-50 text-red-500 text-[10px] font-bold rounded border border-red-100 hover:bg-red-100 transition">요소 삭제</button>
            </div>

            <div id="synapseControls" class="space-y-4 hidden">
                <div>
                    <div class="flex justify-between"><label class="text-[10px] font-bold text-slate-500 mb-1">연결 강도 (Weight)</label><span id="val_weight" class="text-[10px] font-mono text-slate-400">0.8</span></div>
                    <input type="range" id="prop_weight" min="0.1" max="2.0" step="0.1" class="w-full">
                </div>
                <button onclick="deleteSelected()" class="w-full py-2 mt-2 bg-red-50 text-red-500 text-[10px] font-bold rounded border border-red-100 hover:bg-red-100 transition">연결 삭제</button>
            </div>
        </div>

        <!-- Legend -->
        <div class="absolute bottom-16 left-6 flex gap-4 pointer-events-none">
            <div class="glass px-4 py-2 rounded-lg text-[10px] font-bold text-slate-500 flex items-center gap-4">
                <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div> 흥분 (E)</div>
                <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-red-500"></div> 억제 (I)</div>
                <div class="flex items-center gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-slate-400"></div> 입출력 (IO)</div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="footer-info flex flex-col md:flex-row justify-between gap-2">
            <div>
                <span class="font-bold">© 2026. 김현석</span> All rights reserved. 
                <span class="ml-2 font-medium">연락처: <a href="mailto:tragowl@onedu.jje.go.kr" class="underline hover:text-blue-600">tragowl@onedu.jje.go.kr</a></span>
            </div>
            <div class="italic text-slate-400">
                ※ 본 시뮬레이터는 교육용 목적으로 제작되었으며, 영리 목적의 무단 사용을 금합니다. 실제 생물학적 뉴런의 거동을 단순화하여 모델링하였습니다.
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const propPanel = document.getElementById('propPanel');
        
        let width, height;
        let isSimulating = true;
        let camera = { x: 0, y: 0, zoom: 1 };
        let neurons = [];
        let spikes = [];
        
        // Naming Counter
        let typeCounters = { E: 1, I: 1, IO: 1 };

        class Neuron {
            constructor(x, y, type = 'excitatory') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.id = this.generateCleanId(type);
                this.v = 0;
                this.threshold = 1.0;
                this.leak = 0.05;
                this.refractory = 0;
                this.spikeAnim = 0;
                this.connections = []; // { targetId, weight }
            }

            generateCleanId(type) {
                let prefix = 'E';
                if (type === 'inhibitory') prefix = 'I';
                if (type === 'io') prefix = 'IO';
                
                const id = `${prefix}${typeCounters[prefix]}`;
                typeCounters[prefix]++;
                return id;
            }

            update() {
                if (this.refractory > 0) {
                    this.refractory--;
                    this.v *= 0.8;
                } else {
                    this.v *= (1 - this.leak);
                    if (this.v >= this.threshold) this.fire();
                }
                if (this.spikeAnim > 0) this.spikeAnim *= 0.85;
            }

            fire() {
                this.v = 1.2;
                this.spikeAnim = 1.0;
                this.refractory = 25;
                this.connections.forEach(conn => {
                    const target = neurons.find(n => n.id === conn.targetId);
                    if (target) {
                        const dist = Math.sqrt(Math.pow(this.x - target.x, 2) + Math.pow(this.y - target.y, 2));
                        spikes.push(new Spike(this, target, conn.weight, dist));
                    }
                });
            }
        }

        class Spike {
            constructor(source, target, weight, dist) {
                this.source = source;
                this.target = target;
                this.weight = weight;
                this.type = source.type;
                this.dist = dist;
                this.progress = 0;
                this.speed = 4;
            }
            update() {
                this.progress += this.speed;
                if (this.progress >= this.dist) {
                    const effect = this.type === 'inhibitory' ? -this.weight * 1.5 : this.weight;
                    this.target.v += effect;
                    return false;
                }
                return true;
            }
        }

        // --- Helpers ---
        function worldToScreen(x, y) {
            return { x: (x - camera.x) * camera.zoom + width / 2, y: (y - camera.y) * camera.zoom + height / 2 };
        }
        function screenToWorld(x, y) {
            return { x: (x - width / 2) / camera.zoom + camera.x, y: (y - height / 2) / camera.zoom + camera.y };
        }
        function distToSegment(p, v, w) {
            const l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
            if (l2 === 0) return Math.sqrt(Math.pow(p.x - v.x, 2) + Math.pow(p.y - v.y, 2));
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.sqrt(Math.pow(p.x - (v.x + t * (w.x - v.x)), 2) + Math.pow(p.y - (v.y + t * (w.y - v.y)), 2));
        }

        // --- Interaction Logic ---
        let selectedElement = null;
        let hoveredNode = null;
        let draggingNode = null;
        let panning = false;
        let connectingFrom = null;
        let lastMouse = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', e => {
            const worldPos = screenToWorld(e.clientX, e.clientY - 56);
            const clickedNode = neurons.find(n => Math.sqrt(Math.pow(n.x - worldPos.x, 2) + Math.pow(n.y - worldPos.y, 2)) < 30);

            if (e.button === 0) { // Left Click
                if (clickedNode) {
                    const dist = Math.sqrt(Math.pow(clickedNode.x - worldPos.x, 2) + Math.pow(clickedNode.y - worldPos.y, 2));
                    
                    if (e.altKey) {
                        selectedElement = { type: 'node', data: clickedNode };
                        showPanel(e.clientX, e.clientY);
                    } else if (dist > 18) {
                        connectingFrom = clickedNode;
                        closePanel();
                    } else {
                        clickedNode.fire();
                        draggingNode = clickedNode;
                        closePanel();
                    }
                } else {
                    let foundSynapse = null;
                    neurons.forEach(n => {
                        n.connections.forEach(conn => {
                            const target = neurons.find(tn => tn.id === conn.targetId);
                            if (target) {
                                const d = distToSegment(worldPos, n, target);
                                if (d < 10) foundSynapse = { type: 'synapse', source: n, connection: conn };
                            }
                        });
                    });

                    if (e.altKey && foundSynapse) {
                        selectedElement = foundSynapse;
                        showPanel(e.clientX, e.clientY);
                    } else if (!e.altKey) {
                        selectedElement = null;
                        closePanel();
                    }
                }
            } else if (e.button === 2) {
                panning = true;
            }
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', e => {
            const worldPos = screenToWorld(e.clientX, e.clientY - 56);
            hoveredNode = neurons.find(n => Math.sqrt(Math.pow(n.x - worldPos.x, 2) + Math.pow(n.y - worldPos.y, 2)) < 30);

            if (panning) {
                camera.x -= (e.clientX - lastMouse.x) / camera.zoom;
                camera.y -= (e.clientY - lastMouse.y) / camera.zoom;
            } else if (draggingNode) {
                draggingNode.x = worldPos.x;
                draggingNode.y = worldPos.y;
            }
            lastMouse = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', e => {
            if (connectingFrom && hoveredNode && connectingFrom !== hoveredNode) {
                const existing = connectingFrom.connections.find(c => c.targetId === hoveredNode.id);
                if (!existing) {
                    connectingFrom.connections.push({ targetId: hoveredNode.id, weight: 0.8 });
                }
            }
            draggingNode = null;
            panning = false;
            connectingFrom = null;
        });

        window.addEventListener('wheel', e => {
            const zoomSpeed = 0.0015;
            camera.zoom -= e.deltaY * zoomSpeed;
            camera.zoom = Math.max(0.2, Math.min(3, camera.zoom));
        }, { passive: true });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- Panel Controls ---
        function showPanel(x, y) {
            if (!selectedElement) return;
            propPanel.style.display = 'block';
            
            const panelWidth = 240;
            const panelHeight = 320;
            let left = x + 20;
            let top = y - 50;
            if (left + panelWidth > window.innerWidth) left = x - panelWidth - 20;
            if (top + panelHeight > window.innerHeight) top = window.innerHeight - panelHeight - 60;
            
            propPanel.style.left = left + 'px';
            propPanel.style.top = top + 'px';

            const nControls = document.getElementById('neuronControls');
            const sControls = document.getElementById('synapseControls');

            if (selectedElement.type === 'node') {
                const node = selectedElement.data;
                nControls.classList.remove('hidden');
                sControls.classList.add('hidden');
                document.getElementById('propTitle').innerText = `Neuron [${node.id}]`;
                document.getElementById('prop_type').value = node.type;
                document.getElementById('prop_threshold').value = node.threshold;
                document.getElementById('prop_leak').value = node.leak;
                updateLabels(node);

                document.getElementById('prop_type').onchange = e => {
                    // Changing type also suggests a prefix change if desired, but we keep ID consistent for stability.
                    node.type = e.target.value;
                };
                document.getElementById('prop_threshold').oninput = e => { node.threshold = parseFloat(e.target.value); updateLabels(node); };
                document.getElementById('prop_leak').oninput = e => { node.leak = parseFloat(e.target.value); updateLabels(node); };
            } else {
                const syn = selectedElement.connection;
                nControls.classList.add('hidden');
                sControls.classList.remove('hidden');
                document.getElementById('propTitle').innerText = `Synapse Weight`;
                document.getElementById('prop_weight').value = syn.weight;
                document.getElementById('val_weight').innerText = syn.weight.toFixed(1);
                document.getElementById('prop_weight').oninput = e => {
                    syn.weight = parseFloat(e.target.value);
                    document.getElementById('val_weight').innerText = syn.weight.toFixed(1);
                };
            }
        }

        function updateLabels(node) {
            document.getElementById('val_threshold').innerText = node.threshold.toFixed(1);
            document.getElementById('val_leak').innerText = node.leak.toFixed(2);
        }

        function closePanel() { propPanel.style.display = 'none'; }

        function deleteSelected() {
            if (!selectedElement) return;
            if (selectedElement.type === 'node') {
                const id = selectedElement.data.id;
                neurons = neurons.filter(n => n.id !== id);
                neurons.forEach(n => n.connections = n.connections.filter(c => c.targetId !== id));
            } else {
                const source = selectedElement.source;
                source.connections = source.connections.filter(c => c !== selectedElement.connection);
            }
            selectedElement = null;
            closePanel();
        }

        function addNeuron() {
            const pos = screenToWorld(width/2, height/2);
            // Default added is excitatory
            neurons.push(new Neuron(pos.x, pos.y, 'excitatory'));
        }

        function init() {
            typeCounters = { E: 1, I: 1, IO: 1 };
            camera = { x: 0, y: 0, zoom: 1 };
            spikes = [];
            
            // Standard Initial Setup
            const n1 = new Neuron(-250, -100, 'io');
            const n2 = new Neuron(-250, 100, 'io');
            const n3 = new Neuron(0, 0, 'excitatory');
            const n4 = new Neuron(250, 0, 'io');
            
            neurons = [n1, n2, n3, n4];
            
            n1.connections.push({ targetId: n3.id, weight: 1.1 });
            n2.connections.push({ targetId: n3.id, weight: 1.1 });
            n3.connections.push({ targetId: n4.id, weight: 1.5 });
            
            closePanel();
        }

        function updateSim() {
            if (!isSimulating) return;
            neurons.forEach(n => n.update());
            spikes = spikes.filter(s => s.update());
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Draw Synapses
            neurons.forEach(n => {
                const s = worldToScreen(n.x, n.y);
                n.connections.forEach(conn => {
                    const target = neurons.find(node => node.id === conn.targetId);
                    if (!target) return;
                    const e = worldToScreen(target.x, target.y);
                    const isSelected = selectedElement?.type === 'synapse' && selectedElement.connection === conn;
                    
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(e.x, e.y);
                    ctx.strokeStyle = isSelected ? '#3b82f6' : (n.type === 'inhibitory' ? 'rgba(239, 68, 68, 0.4)' : 'rgba(100, 116, 139, 0.2)');
                    ctx.lineWidth = (isSelected ? 5 : 2) * camera.zoom;
                    ctx.stroke();

                    const angle = Math.atan2(e.y - s.y, e.x - s.x);
                    ctx.beginPath();
                    ctx.arc(e.x - Math.cos(angle)*30*camera.zoom, e.y - Math.sin(angle)*30*camera.zoom, 4*camera.zoom, 0, Math.PI*2);
                    ctx.fillStyle = n.type === 'inhibitory' ? '#ef4444' : '#64748b';
                    ctx.fill();
                });
            });

            if (connectingFrom) {
                const s = worldToScreen(connectingFrom.x, connectingFrom.y);
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(lastMouse.x, lastMouse.y - 56);
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            spikes.forEach(s => {
                const r = s.progress / s.dist;
                const pos = worldToScreen(s.source.x + (s.target.x - s.source.x) * r, s.source.y + (s.target.y - s.source.y) * r);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 5 * camera.zoom, 0, Math.PI * 2);
                ctx.fillStyle = s.type === 'inhibitory' ? '#ef4444' : '#3b82f6';
                ctx.shadowBlur = 10 * camera.zoom;
                ctx.shadowColor = ctx.fillStyle;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            neurons.forEach(n => {
                const pos = worldToScreen(n.x, n.y);
                const isSelected = selectedElement?.type === 'node' && selectedElement.data === n;
                const r = (26 + n.spikeAnim * 12) * camera.zoom;
                
                if (n.spikeAnim > 0.02) {
                    const gradient = ctx.createRadialGradient(pos.x, pos.y, r*0.5, pos.x, pos.y, r*2);
                    const color = n.type === 'inhibitory' ? '239, 68, 68' : '59, 130, 246';
                    gradient.addColorStop(0, `rgba(${color}, ${n.spikeAnim*0.5})`);
                    gradient.addColorStop(1, `rgba(${color}, 0)`);
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, r * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
                ctx.fillStyle = n.type === 'inhibitory' ? '#ef4444' : (n.type === 'io' ? '#94a3b8' : '#3b82f6');
                ctx.fill();
                
                ctx.strokeStyle = isSelected ? '#000' : (n === hoveredNode ? '#1e293b' : '#fff');
                ctx.lineWidth = (isSelected ? 6 : 2.5) * camera.zoom;
                ctx.stroke();

                if (n.v > 0.02 && n.refractory === 0) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, r + 5, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * Math.min(1, n.v / n.threshold)));
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 3 * camera.zoom;
                    ctx.stroke();
                }

                ctx.fillStyle = '#fff';
                ctx.font = `bold ${Math.max(8, 11 * camera.zoom)}px Inter`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(n.id, pos.x, pos.y);
            });
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight - 56;
        }

        window.onresize = resize;
        document.getElementById('simToggle').onclick = (e) => {
            isSimulating = !isSimulating;
            e.target.innerText = isSimulating ? '시뮬레이션 가동 중' : '시뮬레이션 중지됨';
            e.target.className = isSimulating ? 'px-4 py-1 bg-slate-800 text-white rounded text-xs font-bold' : 'px-4 py-1 bg-slate-400 text-white rounded text-xs font-bold';
        };
        document.getElementById('resetBtn').onclick = init;

        window.onload = () => {
            resize();
            init();
            (function loop() { 
                updateSim(); 
                draw(); 
                requestAnimationFrame(loop); 
            })();
        };
    </script>
</body>
</html>
